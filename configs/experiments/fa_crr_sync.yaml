experiment:
  name: fa_crr_sync_seed0
  model: FACRRSync
  protocol: finesynchro_450_50_165_seed0_release
  seed: 0

data:
  config: configs/data/finesynchro.yaml
  frame_length: 96
  train_batch_size: 4
  test_batch_size: 1
  workers: 8
  persistent_workers: true
  prefetch_factor: 1
  voter_number: 10
  cached_evaluation_pair_batch_size: 16
  reference_policy: fixed_same_action

model:
  backbone: I3D
  pretrained_backbone: checkpoints/i3d_kinetics400_rgb.pth
  snippets: 9
  snippet_length: 16
  snippet_stride: 10
  stage_count: 3
  stage_size: 5
  feature_dimension: 64
  replay_fusion: temporal_softmax_sum
  foreground_fusion: sigmoid_gate
  use_live_mask: true
  use_replay_mask: true

optimization:
  epochs: 200
  optimizer: Adam
  base_learning_rate: 0.001
  backbone_learning_rate_factor: 0.1
  weight_decay: 0.0
  scheduler: none
  deterministic: true
  mixed_precision: true
  gradient_accumulation_steps: 1
  gradient_scaler_initial_scale: 1024
  evaluation_interval: 5

loss:
  score_weight: 1.0
  transition_weight: 1.0
  synchronisation_weight: 1.0
  ground_truth_stage_warmup_fraction: 0.25

output:
  save_per_sample_predictions: true
  save_reference_ids: true
  save_resolved_config: true
  primary_selection_metric: srcc
